[project]
name = "agenticfiller"
version = "0.1.0"
description = "Multi-user Gmail MCP server: pull emails and PDFs from authenticated Gmail accounts."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Anish" }]

dependencies = [
    # Config
    "python-dotenv>=1.0.0",
    # Google OAuth + Gmail API
    "google-auth>=2.49.2",
    "google-auth-oauthlib>=1.3.1",
    "google-api-python-client>=2.150.0",
    # MCP server
    "mcp[cli]>=1.2.0",
    # PDF parsing
    "pypdf>=5.0.0",
    # LLM-driven structured extraction
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agenticfiller-auth = "agenticfiller.cli.authenticate:main"
agenticfiller-mcp = "agenticfiller.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticfiller"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
